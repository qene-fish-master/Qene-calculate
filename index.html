<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let USER=null;const kk=k=>USER?k+'@'+USER:k;
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(kk(k)))??d}catch{return d}},set(k,v,q){try{localStorage.setItem(kk(k),JSON.stringify(v))}catch{if(!q&&!LS.w){LS.w=1;alert('儲存空間不足或被瀏覽器禁止')}}}};
const DEFS={dark:false,sound:true,secs:15,fs:20,auto:true,showAns:true,pen:'#12303f',autoSave:true,clearNext:false,penW:4,home:null,cardSize:2};let S=Object.assign({},DEFS);
function applySet(){document.documentElement.dataset.theme=S.dark?'dark':'light';document.documentElement.style.setProperty('--fs',S.fs+'px');LS.set('qene.set',S)}
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[ri(0,a.length-1)],gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),lcm=(a,b)=>a/gcd(a,b)*b;
const F=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return[n,d]},fs=([n,d])=>d==1?''+n:n+'/'+d,nf=v=>''+(+v.toPrecision(12)),pad=n=>String(n).padStart(2,'0');
const pf=n=>{const r=[];for(let p=2;p*p<=n;p++)while(n%p==0){r.push(p);n/=p}if(n>1)r.push(n);return r};
function beep(ok){if(!S.sound)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?880:220;g.gain.value=.1;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.15)}catch{}}
/* ===== 運算式解析(正確處理優先順序) ===== */
function calc(s){s=s.replace(/×|x|X|\*/g,'*').replace(/÷/g,'/').replace(/π/g,'pi').replace(/−/g,'-').replace(/\s+/g,'');if(!s)throw Error('請輸入算式');let i=0;
const D=Math.PI/180,FN={sqrt:Math.sqrt,sin:x=>Math.sin(x*D),cos:x=>Math.cos(x*D),tan:x=>Math.tan(x*D),log:Math.log10,ln:Math.log,abs:Math.abs};
function ex(){let v=tm();while(s[i]=='+'||s[i]=='-'){const o=s[i++],r=tm();v=o=='+'?v+r:v-r}return v}
function tm(){let v=pw();while(s[i]=='*'||s[i]=='/'){const o=s[i++],r=pw();if(o=='/'&&r==0)throw Error('除數不能是 0');v=o=='*'?v*r:v/r}return v}
function pw(){if(s[i]=='-'){i++;return-pw()}if(s[i]=='+'){i++;return pw()}const b=pr();if(s[i]=='^'){i++;return Math.pow(b,pw())}return b}
function pr(){let m,v;if(s[i]=='('){i++;v=ex();if(s[i++]!=')')throw Error('括號不成對');return v}
if(m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i))){i+=m[0].length;v=+m[0];if(s[i]=='%'){i++;v/=100}return v}
if(m=/^[a-z]+/.exec(s.slice(i))){i+=m[0].length;if(m[0]=='pi')return Math.PI;if(m[0]=='e')return Math.E;const f=FN[m[0]];if(!f||s[i]!='(')throw Error('無法辨識 '+m[0]);i++;v=ex();if(s[i++]!=')')throw Error('括號不成對');return f(v)}
throw Error('算式格式錯誤')}
const r=ex();if(i<s.length)throw Error('算式格式錯誤');if(!isFinite(r))throw Error('結果無效');return r}
/* ===== 答案比對 ===== */
function num(t){t=t.trim().replace(/\s/g,'');const m=/^(-?\d+)\/(\d+)$/.exec(t);if(m)return+m[1]/+m[2];return/^-?(\d+\.?\d*|\.\d+)$/.test(t)?+t:NaN}
function same(u,a){u=u.trim();if(u===a)return true;if(/^-?\d+$/.test(a))return u.replace(/\s/g,'')===a;
if(a.includes('×')){const n=x=>x.replace(/\s/g,'').replace(/[x*·X]/g,'×').split('×').sort().join('×');return n(u)===n(a)}
const x=num(u),y=num(a);return!isNaN(x)&&!isNaN(y)&&Math.abs(x-y)<=1e-9*Math.max(1,Math.abs(y))}
/* ===== 題目產生 ===== */
const OPS=['+','-','×','÷'],mk=(t,a,s=[],op='其他')=>({t,a:''+a,s,op});
function rb(min,max){const r=max-min+1n;let s='';for(let i=0;i<r.toString().length+3;i++)s+=ri(0,9);return min+BigInt(s)%r}
function rng(d,c){if(c.min!==''&&c.max!==''){let a=BigInt(c.min),b=BigInt(c.max);if(a>b)[a,b]=[b,a];return[a,b]}return[d==1?1n:10n**BigInt(d-1),10n**BigInt(d)-1n]}
function stepsFor(op,a,b,r){if(op=='+'||op=='-')return['對齊位數,由個位往左逐位'+(op=='+'?'相加(滿10進位)':'相減(不夠向前一位借10)'),`${a} ${op} ${b} = ${r}`];
if(op=='×'){const bs=b.toString(),L=bs.length,st=['把乘數 '+b+' 拆成各位數字,逐位相乘:'];[...bs].forEach((ch,i)=>{const z=10n**BigInt(L-1-i);st.push(`${a} × ${BigInt(ch)*z} = ${a*BigInt(ch)*z}`)});st.push('全部相加 = '+r);return st}
return[`${a} ÷ ${b} = ${r}`,`驗算:${b} × ${r} = ${b*r}`]}
function basic(op,c){const[x0,x1]=rng(c.d1,c.c1),[y0,y1]=rng(c.d2,c.c2);let a=rb(x0,x1),b=rb(y0,y1);if(op=='-'&&a<b)[a,b]=[b,a];
if(op=='÷'){if(b<1n)b=1n;if(a<b)a=b*BigInt(ri(1,9));a-=a%b}
const r=op=='+'?a+b:op=='-'?a-b:op=='×'?a*b:a/b;return mk(`${a} ${op} ${b} = ?`,r,stepsFor(op,a,b,r),op)}
const basicGen=c=>{const o=pick(c.ops);return basic(o,{d1:c.d[o][0],d2:c.d[o][1],c1:c.c1,c2:c.c2})};
const DEF=(a,b)=>({ops:['+','-','×'],d:{'+':[a,b],'-':[a,b],'×':[a,b],'÷':[a,b]},c1:{min:'',max:''},c2:{min:'',max:''}});
const E=(e,h)=>{const r=nf(calc(e));return mk(e+' = ?',r,[h,`${e} = ${r}`],'混合')};
const sm=(a,o,b,r,op)=>mk(`${a} ${o} ${b} = ?`,r,[`${a} ${o} ${b} = ${r}`],op);
const ADV={
'四則混合'(){const a=ri(2,30),b=ri(2,12),c=ri(2,9),d=ri(2,9);return E(pick([`${a} + ${b} × ${c}`,`${a} × ${b} - ${c*d} ÷ ${d}`,`${a*b} ÷ ${b} + ${c} × ${d}`]),'先乘除、後加減,由左而右')},
'括號運算'(){const a=ri(2,20),b=ri(2,20),c=ri(2,9);return E(pick([`(${a} + ${b}) × ${c}`,`${c} × (${a+b} - ${b})`,`(${a} + ${b}) × (${c} + 1)`]),'先算括號內')},
'分數運算'(){const d1=ri(2,9),d2=ri(2,9),n1=ri(1,d1),n2=ri(1,d2),o=pick(OPS);const r=o=='+'?[n1*d2+n2*d1,d1*d2]:o=='-'?[n1*d2-n2*d1,d1*d2]:o=='×'?[n1*n2,d1*d2]:[n1*d2,d1*n2];const a=fs(F(...r));return mk(`${n1}/${d1} ${o} ${n2}/${d2} = ?(最簡分數)`,a,['通分或相乘後約分',`結果 = ${a}`],'分數')},
'小數運算'(){const A=ri(11,99),B=ri(11,99),o=pick(['+','-','×']),r=o=='+'?(A+B)/10:o=='-'?(A-B)/10:A*B/100;return mk(`${A/10} ${o} ${B/10} = ?`,nf(r),['去掉小數點當整數算,再還原小數位數',`結果 = ${nf(r)}`],'小數')},
'百分率'(){if(ri(0,1)){const p=pick([5,10,20,25,40,50,75]),x=ri(1,20)*20;return mk(`${x} 的 ${p}% 是多少?`,nf(x*p/100),[`${x} × ${p}/100`],'百分率')}const b=pick([20,25,40,50]),a=ri(1,b);return mk(`${a} 是 ${b} 的幾 %?(只填數字)`,nf(a/b*100),[`${a} ÷ ${b} × 100`],'百分率')},
'次方'(){const n=ri(2,4),a=ri(2,n==4?6:12);return mk(`${a}^${n} = ?`,Math.pow(a,n),[`${a} 連乘 ${n} 次`],'次方')},
'開根號'(){const n=ri(2,25);return mk(`√${n*n} = ?`,n,[`${n}×${n}=${n*n}`],'開根號')},
'最大公因數'(){const g=ri(2,12),a=g*ri(2,12),b=g*ri(2,12);return mk(`${a} 和 ${b} 的最大公因數?`,gcd(a,b),['列出公因數取最大,或輾轉相除'],'最大公因數')},
'最小公倍數'(){const a=ri(2,20),b=ri(2,20);return mk(`${a} 和 ${b} 的最小公倍數?`,lcm(a,b),['a×b÷最大公因數'],'最小公倍數')},
'質數判斷'(){const n=ri(2,150);return mk(`${n} 是質數嗎?(輸入:是 或 否)`,pf(n).length==1?'是':'否',[`${n} = ${pf(n).join('×')}`],'質數判斷')},
'因數分解'(){let n;do n=ri(4,200);while(pf(n).length<2);return mk(`將 ${n} 做質因數分解(例:2×3×5)`,pf(n).join('×'),['由小到大試除質數'],'因數分解')},
'比例計算'(){const a=ri(1,9),b=ri(1,9),k=ri(2,9);return mk(`${a}:${b} = ${a*k}:x,x = ?`,b*k,[`內項積=外項積`,`x = ${b}×${a*k}÷${a}`],'比例')},
'一元一次方程式'(){const x=ri(-9,20),a=ri(2,9),b=ri(-20,20),c=a*x+b;return mk(`${a}x ${b<0?'-':'+'} ${Math.abs(b)} = ${c},x = ?`,x,['移項:'+`${a}x = ${c} ${b<0?'+':'-'} ${Math.abs(b)}`,`x = ${c-b} ÷ ${a}`],'方程式')},
'多步驟運算'(){const a=ri(20,60),b=ri(2,15),c=ri(2,6),d=ri(2,9);return mk(`小明有 ${a} 顆糖,送出 ${b} 顆,又買了 ${c} 包,每包 ${d} 顆,現在有幾顆?`,a-b+c*d,[`${c}×${d}=${c*d}`,`${a}-${b}+${c*d}=${a-b+c*d}`],'多步驟')},
'隨機綜合題'(){return ADV[pick(Object.keys(ADV).filter(k=>k!='隨機綜合題'))]()}};
const GR={
1:{'加法(20內)':d=>{const L=[10,15,20][d-1]||20,a=ri(1,L-1),b=ri(1,L-a);return sm(a,'+',b,a+b,'+')},'減法(20內)':d=>{const L=[10,15,20][d-1]||20,a=ri(2,L),b=ri(1,a);return sm(a,'-',b,a-b,'-')}},
2:{'多位數加減':d=>{const a=ri(10,10**(d+1)),b=ri(10,a),o=pick(['+','-']);return sm(a,o,b,o=='+'?a+b:a-b,o)},'乘法入門':d=>{const a=ri(2,9),b=ri(2,9+3*d);return sm(a,'×',b,a*b,'×')}},
3:{'乘法':d=>{const a=ri(11,10**(d+1)),b=ri(2,9);return sm(a,'×',b,a*b,'×')},'除法':d=>{const b=ri(2,9),q=ri(10,10**(d+1));return sm(b*q,'÷',b,q,'÷')},
'時間':d=>{const h=ri(1,11),m=ri(0,59),add=ri(10,60*d),t=h*60+m+add;return mk(`${h}:${pad(m)} 再過 ${add} 分鐘是幾點幾分?(12小時制,例 3:05)`,`${Math.floor(t/60)%12||12}:${pad(t%60)}`,['換算成分鐘相加再換回時分'],'時間')},
'長度':d=>{const m=ri(1,9*d),c=ri(1,99);return mk(`${m} 公尺 ${c} 公分 = 幾公分?`,m*100+c,['1公尺=100公分'],'長度')}},

box.innerHTML=`<div class="card"><div class="row">目前 <b>${W.length}</b> 題待複習${wf?`(篩選後 <b>${L.length}</b> 題)`:''}</div><div class="row">類型<select data-a="f"><option value="">全部</option>${ops.map(o=>`<option value="${esc(o)}" ${o==wf?'selected':''}>${esc(o)}</option>`).join('')}</select>題數<input class="n" type="number" min="1" value="${Math.min(10,L.length)||10}"><button data-a="go" ${L.length?'':'disabled'}>🔁 重練錯題</button><button class="alt" data-a="clr" ${W.length?'':'disabled'}>清空</button></div><small>練習時答錯、時間到或跳過的題目會自動收進來;在這裡重練時答對就會移出,答錯則累計錯誤次數。</small></div>`+(L.map(w=>`<div class="card"><div class="wi"><div><div class="tt">${esc(w.t)}</div><div><span class="tag">${esc(w.op)}</span><span class="tag">錯 ${w.n} 次</span><small>${esc(w.m||'')}｜${new Date(w.ts).toLocaleDateString()}</small></div></div><button class="alt" data-a="del" data-t="${encodeURIComponent(w.t)}">移除</button></div><details><summary>看答案與解法</summary><div class="fb">答案:${esc(w.a)}\n${(w.s||[]).map((x,i)=>`${i+1}. ${esc(x)}`).join('\n')}</div></details></div>`).join('')||'<div class="card">🎉 目前沒有錯題。去練習吧,答錯的題目會自動收進來。</div>')}
function startWrong(){let Q=wrongList().filter(w=>!wf||w.op==wf);if(!Q.length)return;const n=Math.max(1,Math.min(Q.length,Math.floor(+$('#wb .n').value)||Q.length));
for(let i=Q.length-1;i>0;i--){const j=ri(0,i);[Q[i],Q[j]]=[Q[j],Q[i]]}const asked=new Set();
openRun({mode:'錯題重練',n,secs:0,wrongBook:true,gen:()=>{const cur=wrongList().map(w=>w.t);let R=Q.filter(q=>cur.includes(q.t)&&!asked.has(q.t));if(!R.length){asked.clear();R=Q.filter(q=>cur.includes(q.t))}if(!R.length)R=Q;asked.add(R[0].t);return R[0]}})}
/* ===== 統計 ===== */
function renderStats(){const R=LS.get('qene.rec',[]),Ss=LS.get('qene.ses',[]),n=R.length,ok=R.filter(r=>r.ok).length,ops={};R.forEach(r=>{const a=ops[r.op]=ops[r.op]||[0,0];a[0]++;if(r.ok)a[1]++});
const fast=Math.min(...R.filter(r=>r.ok).map(r=>r.ms)),best=Ss.length?Math.max(...Ss.map(s=>s.sc)):0,L=Ss.slice(-12),pts=L.map((s,i)=>`${L.length>1?i*290/(L.length-1)+5:150},${95-s.ok/s.n*90}`).join(' ');
$('#sb').innerHTML=`<div class="card">總題數 <b>${n}</b>｜答對 <b class="ok">${ok}</b>｜答錯 <b class="bad">${n-ok}</b>｜正確率 <b>${n?Math.round(ok/n*100):0}%</b>｜平均 <b>${n?(R.reduce((a,r)=>a+r.ms,0)/n/1000).toFixed(1):0}</b> 秒<br>最佳單次分數 <b>${best}</b>｜最快答對 <b>${isFinite(fast)?(fast/1000).toFixed(1)+' 秒':'—'}</b></div>
<div class="card"><h3>各種運算表現</h3>${Object.entries(ops).map(([k,[t,o]])=>`<div class="b2"><span>${k}</span><i style="width:${o/t*60}%"></i><b>${Math.round(o/t*100)}% (${o}/${t})</b></div>`).join('')||'尚無資料'}</div>
<div class="card"><h3>近 12 次練習正確率</h3><svg viewBox="0 0 300 100" width="100%" height="140"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pts}"/></svg></div>
<div class="card"><h3>歷史練習紀錄</h3>${Ss.slice(-20).reverse().map(s=>`<div>${new Date(s.t).toLocaleString()}｜${s.m}｜${s.ok}/${s.n} 題｜${s.sc} 分｜平均 ${s.avg.toFixed(1)} 秒</div>`).join('')||'尚無資料'}</div>`}
/* ===== 設定頁 ===== */
function renderSet(){const b=$('#setb');b.innerHTML=`<p><label><input type="checkbox" id="s1" ${S.dark?'checked':''}> 深色模式</label></p><p><label><input type="checkbox" id="s2" ${S.sound?'checked':''}> 音效</label></p><p>快速計算預設每題秒數 <input type="number" id="s3" min="3" value="${S.secs}"></p><p>題目字體 <select id="s4">${[16,20,26,32].map(v=>`<option ${v==S.fs?'selected':''}>${v}</option>`).join('')}</select> px</p><p><label><input type="checkbox" id="s5" ${S.auto?'checked':''}> 答題後自動跳下一題(快速/練習模式)</label></p><p><label><input type="checkbox" id="s6" ${S.showAns?'checked':''}> 答錯時顯示正確答案</label></p><p>筆記預設顏色 <input type="color" id="s7" value="${S.pen}"></p><p><label><input type="checkbox" id="s8" ${S.autoSave?'checked':''}> 草稿自動儲存(下次開啟自動還原)</label></p><p><label><input type="checkbox" id="s9" ${S.clearNext?'checked':''}> 換下一題時自動清空草稿</label></p><p>筆刷預設粗細 <input type="range" id="s10" min="1" max="40" value="${S.penW}"></p><div class="row"><button id="ex">匯出資料(JSON)</button><button class="alt" id="cl">清除練習資料</button></div><p style="color:var(--mut)">青魚計算 Qene Calculate v1.4｜資料只存在本機瀏覽器(localStorage)｜可安裝成 App 並離線使用:iPad/iPhone 用 Safari「分享 → 加入主畫面」,Android/電腦 Chrome 用「安裝應用程式」</p>`;
const bind=(id,k,f=v=>v)=>$('#'+id).onchange=e=>{S[k]=f(e.target.type=='checkbox'?e.target.checked:e.target.value);applySet();if(k=='secs')$('#quick .secs').value=S.secs};
bind('s1','dark');bind('s2','sound');bind('s3','secs',v=>Math.max(3,+v||15));bind('s4','fs',Number);bind('s5','auto');bind('s6','showAns');bind('s7','pen');bind('s8','autoSave');bind('s9','clearNext');bind('s10','penW',Number);$('#s7').addEventListener('change',()=>$$('.pc').forEach(e=>e.value=S.pen));$('#s10').addEventListener('change',()=>$$('.pw').forEach(e=>e.value=S.penW));
$('#ex').onclick=()=>{const d={};Object.keys(localStorage).filter(k=>k.startsWith('qene.')&&(USER?k.endsWith('@'+USER):!k.includes('@'))&&k!='qene.users'&&k!='qene.last').forEach(k=>d[k]=JSON.parse(localStorage.getItem(k)));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:'application/json'}));a.download='qene-data.json';a.click()};
$('#cl').onclick=()=>{if(confirm('確定清除所有練習紀錄、錯題本與筆記?(設定會保留)')){['qene.rec','qene.ses','qene.notes','qene.wrong','qene.draft.main','qene.draft.run'].forEach(k=>localStorage.removeItem(kk(k)));renderNotes()}}}
function openRun(o){$('#fs').hidden=false;document.body.style.overflow='hidden';$('#fsT').textContent=o.mode+(o.opName?' · '+o.opName:'');const c=makeCanvas($('#fsCv'),true,'run');o.onNext=()=>{if(S.clearNext)c.clear()};run($('#fsRun'),o)}
function closeRun(){clearInterval($('#fsRun')._iv);$('#fs').hidden=true;document.body.style.overflow='';if(!$('#wrong').hidden)renderWrong()}
/* ===== 導覽與初始化 ===== */
const HOME=[['quick','⚡','快速計算','限時心算,練速度','#f59e0b'],['slow','🐢','慢速計算','寫過程、查哪步錯','#10b981'],['prac','📘','數學練習','國小一~六年級','#3b82f6'],['scratch','✏️','手寫草稿','觸控筆與手指','#8b5cf6'],['adv','🧮','進階計算','混合運算、方程式','#ec4899'],['wrong','📕','錯題本','答錯的題自動收集,重練到會','#ef4444'],['tools','🧰','數學工具箱','10 種實用工具','#06b6d4'],['stats','📊','學習紀錄','統計與圖表','#f97316'],['set','⚙️','系統設定','外觀與資料','#64748b']];
function go(id){$$('main>section').forEach(s=>s.hidden=s.id!=id);if(id=='home')renderHome();if(id=='stats')renderStats();if(id=='wrong')renderWrong();if(id=='set'){renderSet();renderHomeEd()}window.scrollTo(0,0)}
function renderNotes(){const n=LS.get('qene.notes',[]);$('#notes').innerHTML=n.map((x,i)=>`<div class="row">${new Date(x.t).toLocaleString()} <button class="alt" data-l="${i}">開啟</button><button class="alt" data-d="${i}">刪除</button></div>`).join('')||'尚無保存的筆記'}
const CS=[150,210,280];
function layout(){const base=HOME.map(h=>({id:h[0],icon:h[1],name:h[2],desc:h[3],color:h[4],hide:false})),out=[];(S.home||[]).forEach(o=>{const b=base.find(x=>x.id==o.id);if(b&&!out.find(x=>x.id==b.id))out.push({...b,...o,desc:b.desc})});base.forEach(b=>{if(!out.find(x=>x.id==b.id)){const k=out.findIndex(x=>x.id=='set');k>=0?out.splice(k,0,b):out.push(b)}});return out}
function renderHome(){const R=LS.get('qene.rec',[]),d0=new Date().setHours(0,0,0,0),T=R.filter(r=>r.t>=d0),ok=T.filter(r=>r.ok).length,h=new Date().getHours(),W=wrongList().length,L=layout().filter(x=>!x.hide);
$('#home').innerHTML=`<div class="hero"><h2>${h<12?'早安':h<18?'午安':'晚安'}!今天也來練習吧 🐟</h2><div class="st"><div><b>${T.length}</b><small>今日題數</small></div><div><b>${T.length?Math.round(ok/T.length*100):0}%</b><small>今日正確率</small></div><div><b>${R.length}</b><small>累計題數</small></div></div></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(${CS[(+S.cardSize||2)-1]||210}px,1fr))">`+(L.map(x=>`<button class="hb" onclick="go('${x.id}')"><span class="ic" style="background:${esc(x.color)}">${esc(x.icon)}</span><span><b>${esc(x.name)}</b><small>${x.id=='wrong'&&W?W+' 題待複習':x.desc}</small></span></button>`).join('')||'<div class="card">所有卡片都被隱藏了,請到 ⚙️ 設定 →「首頁排列」重新顯示。</div>')+`</div>`}
/* 首頁排列:只在設定頁內 */
function renderHomeEd(){const L=layout();$('#homeEd').innerHTML=`<h3>🏠 首頁排列</h3><small>調整首頁卡片的順序、名稱、圖示、顏色與顯示/隱藏。</small>`+L.map((x,i)=>`<div class="ed" style="opacity:${x.hide?.55:1}"><span class="ic" style="background:${esc(x.color)}">${esc(x.icon)}</span><input class="ei" data-a="ic" data-id="${x.id}" value="${esc(x.icon)}" aria-label="圖示"><input class="en" data-a="nm" data-id="${x.id}" value="${esc(x.name)}" maxlength="12" aria-label="名稱"><input type="color" data-a="c" data-id="${x.id}" value="${esc(x.color)}"><button class="alt" data-a="u" data-id="${x.id}" ${i?'':'disabled'}>▲</button><button class="alt" data-a="d" data-id="${x.id}" ${i<L.length-1?'':'disabled'}>▼</button><button class="alt" data-a="h" data-id="${x.id}">${x.hide?'顯示':'隱藏'}</button></div>`).join('')+`<div class="row"><label>卡片大小 <select data-a="s">${['小','中','大'].map((t,i)=>`<option value="${i+1}" ${(+S.cardSize||2)==i+1?'selected':''}>${t}</option>`).join('')}</select></label><button class="alt" data-a="reset">還原預設</button></div>`}
function edAct(a,id,val){const L=layout(),i=L.findIndex(x=>x.id==id);
if(a=='reset'){S.home=null;S.cardSize=2;applySet();return renderHomeEd()}
if(a=='s'){S.cardSize=+val;applySet();return}
if(i<0)return;
if(a=='u'&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];
if(a=='d'&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
if(a=='h')L[i].hide=!L[i].hide;
if(a=='c')L[i].color=val;
if(a=='nm'){const n=val.trim().slice(0,12);if(n)L[i].name=n}
if(a=='ic'){const ic=Array.from(val.trim()).slice(0,2).join('');if(ic)L[i].icon=ic}
S.home=L;applySet();if(a=='u'||a=='d'||a=='h')renderHomeEd()}
['quick','slow'].forEach(id=>{const r=$('#'+id),slow=id=='slow';r.querySelector('.cfg').innerHTML=cfgHTML();r.querySelector('.start').onclick=()=>{const c=cfgRead(r);if(!c)return;openRun({mode:slow?'慢速':'快速',slow,n:+r.querySelector('.n').value||10,secs:slow?0:+r.querySelector('.secs').value||0,timer:slow?false:r.querySelector('.tm').checked,gen:()=>basicGen(c)})}});
$('#quick .secs').value=S.secs;
const g=$('#prac .g'),u=$('#prac .u');g.innerHTML=Object.keys(GR).map(k=>`<option value="${k}">${k} 年級</option>`).join('');const fu=()=>u.innerHTML=Object.keys(GR[g.value]).map(k=>`<option>${k}</option>`).join('');g.onchange=fu;fu();
$('#prac .start').onclick=()=>{const d=+$('#prac .d').value,gn=GR[g.value][u.value];openRun({mode:'國小'+g.value+'年級',opName:u.value,n:+$('#prac .n').value||10,secs:0,gen:()=>gn(d)})};
$('#adv .t').innerHTML=Object.keys(ADV).map(k=>`<option>${k}</option>`).join('');
$('#adv .start').onclick=()=>{const k=$('#adv .t').value;openRun({mode:'進階',n:+$('#adv .n').value||10,secs:0,gen:()=>{const q=ADV[k]();if(k!='隨機綜合題')q.op=k;return q}})};
const main=makeCanvas($('#scHost'),true,'main');$('#scHost').addEventListener('saved',renderNotes);
$('#notes').onclick=e=>{const n=LS.get('qene.notes',[]);if(e.target.dataset.l!=null)main.load(n[+e.target.dataset.l].s);if(e.target.dataset.d!=null){n.splice(+e.target.dataset.d,1);LS.set('qene.notes',n);renderNotes()}};
$('#fsCv').addEventListener('saved',renderNotes);
$('#homeEd').onclick=e=>{const t=e.target.closest('button[data-a]');if(t&&!t.disabled)edAct(t.dataset.a,t.dataset.id)};
$('#homeEd').onchange=e=>{const t=e.target;if(t.dataset.a&&t.tagName!='BUTTON')edAct(t.dataset.a,t.dataset.id,t.value)};
$('#wb').onclick=e=>{const t=e.target.closest('button[data-a]');if(!t||t.disabled)return;const a=t.dataset.a;
if(a=='del'){const k=decodeURIComponent(t.dataset.t);LS.set('qene.wrong',wrongList().filter(w=>w.t!=k));renderWrong()}
if(a=='clr'&&confirm('確定清空錯題本?')){LS.set('qene.wrong',[]);renderWrong()}
if(a=='go')startWrong()};
$('#wb').onchange=e=>{if(e.target.dataset.a=='f'){wf=e.target.value;renderWrong()}};
S=Object.assign({},DEFS,LS.get('qene.set',{}));applySet();$('#quick .secs').value=S.secs;renderNotes();renderTools();go('home');
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
